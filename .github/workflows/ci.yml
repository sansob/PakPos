name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install NASM (Windows, for aws-lc)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (core + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p pakpos-core -p pakpos-cli --locked

  cli-smoke:
    name: CLI smoke test (mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pakpos-cli --locked
      - name: Run example collection against the mock API
        run: |
          python3 scripts/mock_httpbin.py 8787 &
          sleep 1
          ./target/debug/pakpos-cli run examples/pakpos-demo.collection.json \
            -e examples/local.environment.json --reporter junit --out junit.xml
          ./target/debug/pakpos-cli run examples/pakpos-demo.collection.json \
            -e examples/local.environment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: junit.xml
