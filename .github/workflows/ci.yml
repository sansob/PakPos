name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install NASM (Windows, for aws-lc)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (core + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p pakpos-core -p pakpos-cli --locked

  cli-smoke:
    name: CLI smoke test (mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pakpos-cli --locked
      - run: cargo build -p pakpos-core --example grpc_demo_server --locked
      - name: Run example collection against the mock API
        run: |
          python3 scripts/mock_httpbin.py 8787 &
          ./target/debug/examples/grpc_demo_server &
          sleep 1
          ./target/debug/pakpos-cli run examples/pakpos-demo.collection.json \
            -e examples/local.environment.json --reporter junit --out junit.xml
          ./target/debug/pakpos-cli run examples/pakpos-demo.collection.json \
            -e examples/local.environment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: junit.xml

  # Builds the Windows installer (with stand-in binaries) and checks that
  # "Add pakpos-cli to PATH" works for all-users and per-user installs and is
  # undone on uninstall.
  windows-installer:
    name: Windows installer (PATH task)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stub | Out-Null
          Set-Content stub\pakpos.exe "stub"
          Set-Content stub\pakpos-cli.exe "stub"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0 /DArch=x64 "/DSourceDir=..\..\stub" packaging\windows\pakpos.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, check PATH, uninstall
        shell: pwsh
        run: |
          $setup = "dist\PakPos-0.0.0-windows-x64-setup.exe"
          $cases = @(
            @{ Mode = "/ALLUSERS"; Dir = "$env:ProgramFiles\PakPos"; Key = "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" },
            @{ Mode = "/CURRENTUSER"; Dir = "$env:LOCALAPPDATA\Programs\PakPos"; Key = "HKCU:\Environment" }
          )
          function Get-RawPath($key) {
            (Get-Item $key).GetValue("Path", "", [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          }
          foreach ($c in $cases) {
            $before = Get-RawPath $c.Key
            $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", $c.Mode, "/TASKS=addtopath", "/LOG=install.log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content install.log; throw "$($c.Mode): setup exited with $($p.ExitCode)" }
            $after = Get-RawPath $c.Key
            if (-not (($after -split ';') -contains $c.Dir)) { throw "$($c.Mode): $($c.Dir) not in PATH: $after" }
            # Installing again must not add it twice.
            Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", $c.Mode, "/TASKS=addtopath" -Wait
            $count = @((Get-RawPath $c.Key) -split ';' | Where-Object { $_ -eq $c.Dir }).Count
            if ($count -ne 1) { throw "$($c.Mode): $($c.Dir) is in PATH $count times" }
            Start-Process "$($c.Dir)\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            for ($i = 0; $i -lt 30 -and (Test-Path "$($c.Dir)\unins000.exe"); $i++) { Start-Sleep 1 }
            $final = Get-RawPath $c.Key
            if (($final -split ';') -contains $c.Dir) { throw "$($c.Mode): $($c.Dir) still in PATH after uninstall" }
            if ($final -ne $before) { throw "$($c.Mode): PATH changed by install + uninstall:`n$before`n$final" }
            Write-Host "$($c.Mode): ok"
          }

  # Builds the .deb, .rpm and AppImage and installs them on clean Ubuntu and
  # Fedora containers (same scripts as the release). Screenshots of the app
  # started from each package are uploaded as an artifact.
  linux-packages:
    name: Linux packages (.deb, .rpm, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packages
      - name: Install dependencies and packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev desktop-file-utils
          cargo install cargo-deb cargo-generate-rpm --locked
          curl -sSLf -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - run: cargo build --release --locked --workspace
      - name: Package
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APPIMAGETOOL=$PWD/appimagetool packaging/linux/build-packages.sh "$V" x86_64 dist
      - name: Install and start on Ubuntu and Fedora
        run: packaging/linux/test-packages.sh dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-package-screenshots
          path: dist/screenshots/*
