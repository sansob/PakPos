name: Release

# Push a tag like v0.2.0 (see docs/src/contributing/releasing.md) to build
# installers for Windows, macOS and Linux and publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        name: Check tag matches Cargo.toml version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG does not match workspace version $CARGO_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked --workspace
      - name: Package tar.gz
        run: |
          V=${{ needs.meta.outputs.version }}
          NAME=pakpos-$V-linux-${{ matrix.arch }}
          mkdir -p dist/$NAME
          cp target/release/pakpos target/release/pakpos-cli README.md LICENSE-MIT LICENSE-APACHE dist/$NAME/
          cp packaging/linux/pakpos.desktop assets/icon-256.png dist/$NAME/
          mkdir -p dist/$NAME/licenses && cp assets/fonts/OFL-*.txt dist/$NAME/licenses/
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          rm -rf dist/$NAME
      - name: Install packaging tools
        run: |
          sudo apt-get install -y desktop-file-utils
          cargo install cargo-deb cargo-generate-rpm --locked
          curl -sSLf -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${{ matrix.arch }}.AppImage
          chmod +x appimagetool
      - name: Package .deb, .rpm and AppImage
        run: APPIMAGETOOL=$PWD/appimagetool packaging/linux/build-packages.sh ${{ needs.meta.outputs.version }} ${{ matrix.arch }} dist
      # Install the packages on clean distributions and start the app (under
      # Xvfb) to catch missing runtime dependencies, not just packaging errors.
      - name: Test the packages on Ubuntu and Fedora
        run: |
          packaging/linux/test-packages.sh dist
          mkdir -p screenshots && mv dist/screenshots/* screenshots/ && rmdir dist/screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-screenshots
          path: screenshots/*
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Install NASM (x64 only, for aws-lc)
        if: matrix.arch == 'x64'
        uses: ilammy/setup-nasm@v1
      - run: cargo build --release --locked --workspace
      # Code signing through SignPath (docs/src/code-signing-policy.md). It runs
      # once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN exist; until then the release is built unsigned.
      - name: Upload executables for signing
        id: unsigned-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe-${{ matrix.arch }}
          path: |
            target/release/pakpos.exe
            target/release/pakpos-cli.exe
      - name: Sign executables (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PakPos' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release
      - name: Package zip
        shell: pwsh
        run: |
          $v = "${{ needs.meta.outputs.version }}"
          $name = "pakpos-$v-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist\$name\licenses" | Out-Null
          Copy-Item target\release\pakpos.exe, target\release\pakpos-cli.exe, README.md, LICENSE-MIT, LICENSE-APACHE "dist\$name\"
          Copy-Item assets\fonts\OFL-*.txt "dist\$name\licenses\"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip"
          Remove-Item -Recurse "dist\$name"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.meta.outputs.version }}" "/DArch=${{ matrix.arch }}" "/DSourceDir=..\..\target\release" packaging\windows\pakpos.iss
      - name: Upload installer for signing
        id: unsigned-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup-${{ matrix.arch }}
          path: dist/*-setup.exe
      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PakPos' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist
      - name: Check signatures
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($f in @("target\release\pakpos.exe", "target\release\pakpos-cli.exe") + (Get-ChildItem dist\*-setup.exe).FullName) {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne "Valid") { throw "$f is not signed: $($s.Status)" }
            Write-Host "$f signed by $($s.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace --target aarch64-apple-darwin
      - run: cargo build --release --locked --workspace --target x86_64-apple-darwin
      - run: packaging/macos/make-dmg.sh ${{ needs.meta.outputs.version }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*

  publish:
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Keep release files only
        # The package-test screenshots (PNG) stay workflow artifacts.
        run: rm -f dist/*.png
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Package manager manifests (Homebrew, winget, AUR, Flatpak)
        run: |
          V=${{ needs.meta.outputs.version }}
          python3 packaging/make-manifests.py --version "$V" --sums dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --out manifests
          (cd manifests && zip -qr "../dist/pakpos-$V-package-manifests.zip" .)
          (cd dist && sha256sum "pakpos-$V-package-manifests.zip" >> SHA256SUMS.txt)
      - name: Release notes from CHANGELOG
        run: |
          V=${{ needs.meta.outputs.version }}
          # The section of this version, without the link definitions at the end.
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {next}
            found {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $V" > notes.md
          cat >> notes.md <<'NOTES'

          ### Downloads
          | Platform | File |
          |---|---|
          | Windows 10/11 x64 | `PakPos-*-windows-x64-setup.exe` (installer) or `pakpos-*-windows-x64.zip` (portable) |
          | Windows 11 ARM64 | `PakPos-*-windows-arm64-setup.exe` or `pakpos-*-windows-arm64.zip` |
          | macOS 11+ (Apple Silicon & Intel) | `PakPos-*-macos-universal.dmg` |
          | Linux x86_64 / arm64 | `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL/openSUSE), `.AppImage` (any distro) or `.tar.gz` |

          Verify downloads with `SHA256SUMS.txt`. Builds are not code-signed yet; see the installation guide for the first-launch steps on macOS and Windows.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: PakPos ${{ needs.meta.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: dist/*
