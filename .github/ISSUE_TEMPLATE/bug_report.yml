name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: PakPos version
      placeholder: "0.1.0 (status bar or `pakpos-cli --version`)"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux (X11), Linux (Wayland), Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you got. Remove tokens and passwords!
    validations: { required: true }
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots or a minimal collection
