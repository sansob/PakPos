[workspace]
resolver = "2"
members = ["crates/pakpos-core", "crates/pakpos-cli", "crates/pakpos-app"]
default-members = ["crates/pakpos-core", "crates/pakpos-cli", "crates/pakpos-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sansob/PakPos"
homepage = "https://github.com/sansob/PakPos"
authors = ["PakPos contributors"]
keywords = ["http", "api", "rest", "postman", "client"]
categories = ["development-tools", "web-programming::http-client"]

[workspace.dependencies]
pakpos-core = { path = "crates/pakpos-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart", "gzip", "brotli", "deflate", "cookies"] }
directories = "6"
rand = "0.9"
base64 = "0.22"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
