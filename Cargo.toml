[workspace]
resolver = "2"
members = ["crates/pakpos-core", "crates/pakpos-cli", "crates/pakpos-app"]
default-members = ["crates/pakpos-core", "crates/pakpos-cli", "crates/pakpos-app"]

[workspace.package]
version = "0.3.0-rc.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sansob/PakPos"
homepage = "https://github.com/sansob/PakPos"
authors = ["PakPos contributors"]
keywords = ["http", "api", "rest", "client", "testing"]
categories = ["development-tools", "web-programming::http-client"]

[workspace.dependencies]
pakpos-core = { path = "crates/pakpos-core", version = "0.3.0-rc.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart", "gzip", "brotli", "deflate", "cookies"] }
directories = "6"
rand = "0.10"
base64 = "0.23"
url = "2"
sha2 = "0.11"
hmac = "0.13"
md-5 = "0.11"
md4 = "0.11"
cookie = "0.18"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
yaml-rust2 = { version = "0.13", default-features = false }
rquickjs = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-aws-lc", "tls-native-roots"] }
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
tokio-stream = "0.1"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
