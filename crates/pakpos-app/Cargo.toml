[package]
name = "pakpos"
description = "PakPos: a fast, native, open-source API client written in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "pakpos"
path = "src/main.rs"

[dependencies]
pakpos-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.36", features = ["syntect"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }


[package.metadata.deb]
name = "pakpos"
maintainer = "PakPos contributors"
section = "devel"
priority = "optional"
extended-description = "PakPos is a fast, native, open-source API client written in Rust."
assets = [
  ["target/release/pakpos", "usr/bin/", "755"],
  ["target/release/pakpos-cli", "usr/bin/", "755"],
  ["../../packaging/linux/pakpos.desktop", "usr/share/applications/", "644"],
  ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/pakpos.png", "644"],
]
