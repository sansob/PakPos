[package]
name = "pakpos"
description = "PakPos: a fast, native, open-source API client written in Rust."
version.workspace = true
edition.workspace = true
rust-version = "1.95" # egui 0.36
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

build = "build.rs"

[[bin]]
name = "pakpos"
path = "src/main.rs"

[dependencies]
pakpos-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.36", features = ["syntect", "image"] }
rfd = "0.17"
directories.workspace = true
webbrowser = "1"
reqwest.workspace = true
prost-reflect.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }


[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "pakpos"
maintainer = "PakPos contributors"
section = "devel"
priority = "optional"
extended-description = "PakPos is a fast, native, open-source API client written in Rust. Includes the desktop app (pakpos) and the CLI runner / MCP server (pakpos-cli)."
depends = "$auto"
assets = [
  ["target/release/pakpos", "usr/bin/", "755"],
  ["target/release/pakpos-cli", "usr/bin/", "755"],
  ["../../packaging/linux/pakpos.desktop", "usr/share/applications/", "644"],
  ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/pakpos.png", "644"],
  ["../../assets/fonts/OFL-*.txt", "usr/share/doc/pakpos/fonts/", "644"],
]
